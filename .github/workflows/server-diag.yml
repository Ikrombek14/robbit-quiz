name: Server diagnostika (faqat o'qish)

# Sayt ochilmay qolganda nginx/pm2 holatini ko'rish uchun. Hech narsani o'zgartirmaydi.
# Repo ommaviy — loglarga sir/parol chiqarmang (faqat holat, nomlar, portlar).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/server-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: sshpass o'rnatish
        run: sudo apt-get install -y sshpass

      - name: Holatni ko'rish
        env:
          SSHPASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            echo "=== uptime ==="; uptime
            echo "=== disk ==="; df -h / | tail -1
            echo "=== 80/443 tinglovchilar ==="; ss -ltnp | grep -E ":(80|443|4000) " || true
            echo "=== web-serverlar ==="; for s in nginx apache2 caddy haproxy x-ui xray docker; do printf "%s: " $s; systemctl is-active $s 2>/dev/null || echo "-"; done
            echo "=== docker ==="; docker ps --format "{{.Names}} {{.Ports}}" 2>/dev/null || true
            echo "=== nginx -t ==="; nginx -t 2>&1 || true
            echo "=== sites-enabled / conf.d ==="; ls -la /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>&1
            echo "=== server_name/listen ==="; grep -rnE "server_name|listen|default_server|ssl_reject_handshake|return 444|ssl_certificate " /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null
            echo "=== sertifikatlar ==="; for c in /etc/letsencrypt/live/*/cert.pem; do echo "$c: $(openssl x509 -enddate -noout -in $c 2>/dev/null)"; done
            echo "=== pm2 ==="; pm2 ls 2>&1 | head -20
            echo "=== ilova (4000) ==="; curl -s -o /dev/null -m 10 -w "%{http_code}\n" http://127.0.0.1:4000/ || true
            echo "=== nginx jurnal ==="; journalctl -u nginx --since "5 days ago" --no-pager 2>/dev/null | tail -20
            echo "=== nginx error.log ==="; tail -20 /var/log/nginx/error.log 2>/dev/null
            echo "=== /etc/nginx oxirgi o zgarishlar ==="; find /etc/nginx -newermt "-7 days" -type f -printf "%TY-%Tm-%Td %TH:%TM %p\n" 2>/dev/null | sort
          '
