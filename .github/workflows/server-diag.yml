name: Server diagnostika (faqat o'qish)

# Sayt ochilmay qolganda nginx/pm2 holatini ko'rish uchun. Hech narsani o'zgartirmaydi.
# Repo ommaviy — loglarga sir/parol chiqarmang (faqat holat, nomlar, portlar).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/server-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: sshpass o'rnatish
        run: sudo apt-get install -y sshpass

      - name: Holatni ko'rish
        env:
          SSHPASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            echo "=== removed-apps ==="; ls -la --time-style=+%Y-%m-%d_%H:%M /root/backups/removed-apps-20261026/ 2>&1
            echo "=== removed-apps ichida robbit ==="; find /root/backups/removed-apps-20261026 -maxdepth 3 -iname "*robbit*" -printf "%TY-%Tm-%Td_%TH:%TM %s %p\n" 2>/dev/null | head -30
            echo "=== removed-apps dump/sql/arxiv ==="; find /root/backups/removed-apps-20261026 -maxdepth 4 \( -name "*.sql*" -o -name "*.dump" -o -name "*.tar*" -o -name "*.tgz" -o -name "*.zip" \) -printf "%TY-%Tm-%Td_%TH:%TM %s %p\n" 2>/dev/null | head -30
            for d in /root/apps/robbit-quiz /root/backups/removed-apps-20261026/robbit-quiz; do echo "--- $d/uploads: $(ls $d/uploads 2>/dev/null | wc -l) fayl, $(du -sh $d/uploads 2>/dev/null | cut -f1)"; done
            echo "=== hozirgi baza ==="; sudo -u postgres psql -p 5435 -d robbit_quiz -tAc "SELECT count(*) FROM \"Teacher\"" 2>&1 | sed "s/^/Teacher: /"
            sudo -u postgres psql -p 5435 -d robbit_quiz -tAc "SELECT count(*) FROM \"Quiz\"" 2>&1 | sed "s/^/Quiz: /"
            echo "=== backup 20261024 boshi ==="; head -c 300 /root/backups/robbit_quiz_20261024_061352.sql | grep -E "PostgreSQL|dump" ; grep -c "^COPY" /root/backups/robbit_quiz_20261024_061352.sql
            echo "=== pm2 ==="; pm2 ls 2>&1 | grep -E "robbit|name"
          '
